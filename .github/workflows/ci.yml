name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S tests -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build tests
        run: cmake --build build/host --parallel 2
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build Cardputer ADV
        run: pio run -d firmware -e ghostble_cardputer
      - name: Check application partition capacity
        run: test "$(stat -c%s firmware/.pio/build/ghostble_cardputer/firmware.bin)" -le 3145728
